name: update

on:
  schedule:
    - cron: "0 19 * * *"   # 4:00 アンサンブルだけ取る
    - cron: "30 20 * * *"  # 5:30（日本時間）
    - cron: "30 2 * * *"   # 11:30
    - cron: "30 8 * * *"   # 17:30
  workflow_dispatch:

permissions:
  contents: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - name: アンサンブルのまとめ（1日1回取り直す）を前の実行から引き継ぐ
        uses: actions/cache@v4
        with:
          path: data/ens_daily.json
          key: ens-${{ github.run_id }}
          restore-keys: ens-
      - name: アンサンブルだけ取る（4時の回）
        if: github.event.schedule == '0 19 * * *'
        run: |
          set -o pipefail
          python -u fetch.py ens 2>&1 | tee data/fetch_log.txt
      - name: 予報と観測を取得
        if: github.event.schedule != '0 19 * * *'
        run: |
          set -o pipefail
          python -u fetch.py 2>&1 | tee data/fetch_log.txt
      - name: ページを作る
        if: github.event.schedule != '0 19 * * *'
        run: python build.py
      - name: パウダーなら通知
        if: github.event.schedule != '0 19 * * *'
        continue-on-error: true  # 通知が失敗してもページは保存する
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python notify.py
      - name: 保存
        if: github.event.schedule != '0 19 * * *'
        run: |
          git config user.name "raka-works"
          git config user.email "raka-works@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch data/fetch_log.txt; git rm -q --cached --ignore-unmatch data/summary.json; git add index.html r data/notified.json data/onemonth.json
          git diff --cached --quiet || git commit -m "update $(date -u +%FT%H:%MZ)"
          git pull --rebase -X theirs -q || true
          git push
      - name: 失敗したら取得のログを残す（Actions のログは外から読めないため）
        if: failure()
        run: |
          git config user.name "raka-works"
          git config user.email "raka-works@users.noreply.github.com"
          git add -f data/fetch_log.txt
          git commit -m "fetch failed $(date -u +%FT%H:%MZ)" && git push
