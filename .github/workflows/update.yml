name: update

on:
  schedule:
    - cron: "30 20 * * *"  # 5:30（日本時間）
    - cron: "30 2 * * *"   # 11:30
    - cron: "30 8 * * *"   # 17:30
  workflow_dispatch:

permissions:
  contents: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - name: アンサンブルのまとめ（1日1回取り直す）を前の実行から引き継ぐ
        uses: actions/cache@v4
        with:
          path: data/ens_daily.json
          key: ens-${{ github.run_id }}
          restore-keys: ens-
      - name: 予報と観測を取得
        run: python fetch.py
      - name: ページを作る
        run: python build.py
      - name: パウダーなら通知
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python notify.py
      - name: 保存
        run: |
          git config user.name "raka-works"
          git config user.email "raka-works@users.noreply.github.com"
          git add index.html r data/summary.json data/notified.json data/onemonth.json
          git diff --cached --quiet || git commit -m "update $(date -u +%FT%H:%MZ)"
          git push
